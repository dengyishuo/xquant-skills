name: Validate and package Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Compile scripts
        run: python -m compileall -q ashare-fundamentals/scripts scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build universal Skill package
        run: python scripts/build_skill_package.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ashare-fundamentals-skill
          path: dist/*.zip


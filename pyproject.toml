[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xquant-skills"
version = "0.1.0"
description = "Reusable Agent Skills for A-share financial data and XQuant workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Deng Yishuo"}]
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14",
  "requests>=2.31",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
mysql = ["PyMySQL>=1.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

